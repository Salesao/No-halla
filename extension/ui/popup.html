<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-i18n="gate.popup.title"></title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <div class="shell">
    <header class="head">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1 class="brand-name" data-i18n="gate.popup.title"></h1>
      </div>
      <label class="head-master" for="master">
        <span class="head-master-label" data-i18n="gate.popup.master"></span>
        <input id="master" class="switch" type="checkbox" role="switch">
      </label>
    </header>

    <main class="content">
      <section class="card status-card">
        <div class="status-line">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-pill" class="status-pill" role="status" aria-live="polite" data-i18n="gate.status.checking"></span>
        </div>
        <p id="status-lore" class="status-lore"></p>
      </section>

      <section class="card facts">
        <p class="fact">
          <span class="fact-key" data-i18n="gate.popup.currentIP"></span>
          <span id="current-ip" class="fact-value mono"></span>
          <button id="add-current-ip" class="row-add" type="button" data-i18n="gate.options.add" data-i18n-aria-label="gate.options.addCurrentIP" data-i18n-title="gate.options.addCurrentIP"></button>
        </p>
        <p class="fact">
          <span class="fact-key" data-i18n="gate.options.trusted"></span>
          <span id="trusted-count" class="fact-value"></span>
        </p>
        <p class="fact">
          <span id="last-check" class="fact-value"></span>
        </p>
      </section>

      <section class="card domains-card">
        <div class="card-head">
          <h2 class="section-title" data-i18n="gate.options.domains"></h2>
          <span id="domain-count" class="count"></span>
        </div>
        <ul id="domain-list" class="domain-list"></ul>
        <p id="domain-empty" class="empty" data-i18n="gate.options.noDomains" hidden></p>
        <form id="domain-form" class="add-row" novalidate>
          <label class="sr-only" for="domain-input" data-i18n="gate.options.domains"></label>
          <input id="domain-input" class="field" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="gate.options.domainPlaceholder">
          <button id="domain-add" class="btn btn-primary btn-compact" type="submit" data-i18n="gate.options.add"></button>
        </form>
        <button id="add-current-site" class="link-add" type="button" data-i18n="gate.options.addCurrentSite"></button>
        <p class="section-help" data-i18n="gate.options.domainsHelp"></p>
        <p id="domain-error" class="message" aria-live="polite" hidden></p>
      </section>

      <p id="message" class="message" aria-live="polite" hidden></p>

      <div class="actions">
        <button id="check-now" class="btn btn-primary" type="button" data-i18n="gate.popup.checkNow"></button>
        <button id="settings" class="btn btn-secondary" type="button" data-i18n="gate.popup.settings"></button>
      </div>
    </main>

    <footer class="foot">
      <a
        class="foot-link"
        href="https://github.com/Salesao/No-halla"
        target="_blank"
        rel="noopener noreferrer"
        data-i18n="gate.popup.repository"
      ></a>
    </footer>
  </div>
</body>
</html>

<script>
const preview = new URLSearchParams(location.search);
const state = document.getElementById("view-" + preview.get("view"));
if (state instanceof HTMLTemplateElement) {
  document.querySelector("main").replaceWith(state.content.cloneNode(true));
  const main = document.querySelector("main");
  const width = state.dataset.width;
  const height = state.dataset.height;
  document.body.style.width = "min(100%, " + width + "px)";
  document.body.style.minHeight = height + "px";
  if (main.matches(".window,.sheet,.alert,.notification")) main.style.minHeight = height + "px";
  if (state.dataset.theme) document.documentElement.dataset.theme = state.dataset.theme;
  document.documentElement.lang = state.dataset.language;
}
const previewTheme = preview.get("theme");
if (previewTheme === "system") document.documentElement.removeAttribute("data-theme");
if (["light", "dark", "contrast"].includes(previewTheme)) document.documentElement.dataset.theme = previewTheme;

function navigateInAppearance(href) {
  const next = new URL(href, location.href);
  const appearance = previewTheme === "system" ? "system" : document.documentElement.dataset.theme;
  if (appearance && !next.searchParams.has("theme")) next.searchParams.set("theme", appearance);
  location.href = next.href;
}
document.addEventListener("click", event => {
  const manual = event.target.closest("[data-validate]");
  if (manual) {
    const field = document.querySelector("#manual");
    field.dispatchEvent(new Event("input", {bubbles:true}));
    if (field.value.trim() && field.getAttribute("aria-invalid") === "false") {
      navigateInAppearance("onboarding-3.html?view=onboarding-trusted");
    } else {
      field.focus();
    }
    return;
  }
  const link = event.target.closest("[data-href]");
  if (link && !event.target.disabled) {
    event.preventDefault();
    navigateInAppearance(link.dataset.href);
  }
});
document.addEventListener("input", event => {
  const input = event.target;
  if (input.type === "range") {
    const output = input.nextElementSibling;
    output.textContent = input.value + " " + output.textContent.split(" ")[1];
  }
  if (input.type === "search") {
    const term = input.value.trim().toLowerCase();
    let count = 0;
    document.querySelectorAll("[data-search]").forEach(row => {
      const visible = row.dataset.search.includes(term);
      row.hidden = !visible;
      if (visible) count++;
    });
    const empty = document.querySelector("[data-no-results]");
    if (empty) empty.hidden = count !== 0;
  }
  if (input.type === "checkbox" && input.closest(".pickrow")) {
    const choices = document.querySelectorAll(".pickrow input:checked:not(:disabled)").length;
    const summary = document.querySelector("[data-count]");
    if (summary) summary.textContent = choices === 1 ? "1 app selected" : choices + " apps selected";
    const add = document.querySelector(".sheetfoot .cmp-Button[data-placeholder], .sheetfoot > div:last-child button");
    if (add) {
      add.disabled = choices === 0;
      add.dataset.tone = choices === 0 ? "disabled" : "primary";
    }
  }
  if (input.hasAttribute("data-endpoint")) {
    const valid = URL.canParse(input.value) && new URL(input.value).protocol === "https:";
    const error = document.querySelector("#endpoint-help");
    const save = document.querySelector("[data-save-endpoint] button");
    input.setAttribute("aria-invalid", String(!valid));
    error.classList.toggle("error", !valid);
    error.textContent = valid ? "Use an HTTPS endpoint that returns an IP address." : "Enter a valid HTTPS URL.";
    save.disabled = !valid;
    save.dataset.tone = valid ? "primary" : "disabled";
  }
  if (input.id === "manual") {
    const value = input.value.trim();
    const [addr, bits, ...extra] = value.split("/");
    const ipv4 = /^(?:\d{1,3}\.){3}\d{1,3}$/.test(addr) && addr.split(".").every(n => Number(n) <= 255);
    const ipv6 = addr.includes(":") && URL.canParse("http://[" + addr + "]/");
    const valid = !extra.length && (ipv4 || ipv6) && (bits === undefined || (/^\d+$/.test(bits) && Number(bits) <= (ipv4 ? 32 : 128)));
    const error = value !== "" && !valid;
    input.setAttribute("aria-invalid", String(error));
    const help = document.querySelector("#iphelp");
    help.classList.toggle("error", error);
    help.textContent = error ? "Enter a valid IPv4, IPv6 or CIDR address." : "Enter an IPv4, IPv6 or CIDR address.";
  }
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") document.querySelectorAll("details[open]").forEach(item => item.removeAttribute("open"));
});
</script></body></html>
